[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ora-warden"
version = "0.1.0"
description = "A fail-closed MCP server that gives local AI agents a governed shell, human approval queue, and tamper-evident audit — your agent can't delete, spend, or exfiltrate without your yes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Randall Marshall", email = "info@3d3d.ca" }]
keywords = ["mcp", "model-context-protocol", "ai-agent", "governance", "security", "guardrails", "audit", "fail-closed", "agent-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://ora.3d3d.ca"
Repository = "https://github.com/3d3dcanada/ora-warden"

[project.scripts]
ora-warden = "ora_warden.server:main"

[tool.hatch.build.targets.wheel]
packages = ["ora_warden"]
